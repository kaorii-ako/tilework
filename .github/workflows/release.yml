# Push a tag like v0.1.0 to build the AppImage and attach it to a draft release.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*.AppImage
