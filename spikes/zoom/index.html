<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Zoom spike</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1115;
        color: #d6dae3;
        font:
          12px system-ui,
          sans-serif;
        overflow: hidden;
      }
      #bar {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 10;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        padding: 8px 12px;
        background: #181b22;
        border-bottom: 1px solid #262b35;
      }
      #bar label {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      #out {
        position: fixed;
        right: 8px;
        bottom: 8px;
        z-index: 10;
        max-width: 520px;
        max-height: 40vh;
        overflow: auto;
        margin: 0;
        padding: 8px;
        background: #181b22ee;
        border: 1px solid #262b35;
        white-space: pre-wrap;
      }
      #viewport {
        position: absolute;
        inset: 44px 0 0 0;
        overflow: hidden;
      }
      #world {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }
      .tile {
        position: absolute;
        display: flex;
        flex-direction: column;
        background: #14171d;
        border: 1px solid #262b35;
        border-radius: 10px;
        overflow: hidden;
      }
      .tile-bar {
        padding: 4px 10px;
        color: #8a93a6;
        border-bottom: 1px solid #262b35;
        user-select: none;
        white-space: nowrap;
      }
      .tile-term {
        flex: 1;
        min-height: 0;
        padding: 4px 0 0 6px;
      }
      .snap {
        flex: 1;
        margin: 0;
        padding: 4px 0 0 6px;
        overflow: hidden;
        color: #d6dae3;
        font-family: 'JetBrains Mono', 'Cascadia Code', 'DejaVu Sans Mono', monospace;
        cursor: zoom-in;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <label
        >approach
        <select id="approach">
          <option value="transform">1. CSS transform</option>
          <option value="font">2. fontSize + refit</option>
          <option value="hybrid">3. hybrid snapshot</option>
        </select>
      </label>
      <label
        >renderer
        <select id="renderer">
          <option value="webgl">webgl</option>
          <option value="dom">dom</option>
        </select>
      </label>
      <label
        >zoom <input id="zoom" type="range" min="0.25" max="2" step="0.05" value="1" />
        <span id="zoomVal">100%</span></label
      >
      <label><input id="stream" type="checkbox" checked /> stream output</label>
      <button id="hit">hit test</button>
      <button id="perf">perf sweep</button>
    </div>
    <div id="viewport"><div id="world"></div></div>
    <pre id="out">Pick an approach, zoom, then drag-select text in a tile.</pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
